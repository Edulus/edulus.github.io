<!-- Updated index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edward Kasimir - Launch Page</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="animation.css" />
  </head>
  <body>
    <div class="container">
      <div class="button-wrapper" id="button1Wrapper">
        <a
          href="https://edulus.github.io/Close-Encounters-with-5-Tones/"
          class="button"
          id="button1"
        ></a>
        <div class="tooltip">Close Encounters with 5 Tones</div>
      </div>
      <div class="button-wrapper" id="button2Wrapper">
        <a href="https://edulus.github.io/Swirling-Cosmic-Egg/" class="button" id="button2"></a>
        <div class="tooltip">Swirling Cosmic Egg</div>
      </div>
      <div class="button-wrapper" id="button3Wrapper">
        <a href="https://edulus.github.io/Space-Sounds-Generator/" class="button" id="button3"></a>
        <div class="tooltip">Space Sounds Generator</div>
      </div>
      <div class="button-wrapper" id="button4Wrapper">
        <a
          href="https://edulus.github.io/Ethereal_Chord_Generator/"
          class="button"
          id="button4"
        ></a>
        <div class="tooltip">Ethereal Chord Generator</div>
      </div>
      <div class="button-wrapper" id="button5Wrapper">
        <a href="https://edulus.github.io/YT-DLP_Web_Interface/" class="button" id="button5"></a>
        <div class="tooltip">YouTube Audio Extractor</div>
      </div>
      <div class="button-wrapper" id="button6Wrapper">
        <a href="https://edulus.github.io/space-pong/" class="button" id="button6"></a>
        <div class="tooltip">Space Pong</div>
      </div>
      <div class="button-wrapper" id="button7Wrapper">
        <a href="https://edulus.github.io/camp-location-chooser/" class="button" id="button7">
          <img src="https://raw.githubusercontent.com/Edulus/camp-location-chooser/main/3D%20SideBurn%20Logo.png" alt="Camp Location Chooser" />
        </a>
        <div class="tooltip">Camp Location Chooser</div>
      </div>
    </div>
    <script src="instrument-mixes.js"></script>
    <script src="mesh-audio.js"></script>
    <script src="background.js"></script>
    <script src="tuner.js"></script>
    <script src="controls.js"></script>
    <script src="seed-music.js"></script>
    <script src="layout.js"></script>
    <script src="animation.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const musicalMesh = new MusicalMesh();
        const background = new BackgroundField({ musicalMesh });

        // Link the mesh to background so syncWaveSpeed() can write the
        // tunable wave speed through to the visual side; also seed the
        // mesh's mirror property with the current visual default.
        musicalMesh.background = background;
        musicalMesh.waveSpeed = background.waveSpeed;

        // Seed-music panel is registered alongside the tuners so the
        // ControlBar's "only one panel open" rule applies to it too.
        const seedSequencer = new SeedSequencer(musicalMesh, background);

        // Tuner panels are always instantiated (hidden by default) so the
        // ControlBars can toggle them. URL ?tune=1 / ?tune=2 / ?tune=3
        // still works as a deep-link to a specific panel.
        const tuners = {
          halo:       new Tuner(background, "halo"),
          pip:        new Tuner(background, "pip"),
          sound:      new Tuner(musicalMesh, "sound"),
          tonal:      new Tuner(musicalMesh, "tonal"),
          color:      new Tuner(background, "color"),
          instrument: new Tuner(musicalMesh, "instrument"),
          seed:       seedSequencer,
        };
        const tuneParam = (new URLSearchParams(location.search).get("tune") || "").toLowerCase();
        if (tuneParam === "1") tuners.halo.show();
        else if (tuneParam === "2") tuners.pip.show();
        else if (tuneParam === "3") tuners.sound.show();
        else if (tuneParam === "4") tuners.tonal.show();
        else if (tuneParam === "5") tuners.color.show();
        else if (tuneParam === "6") tuners.instrument.show();
        else if (tuneParam === "7") tuners.seed.show();

        const instrumentSelector = new InstrumentSelector(musicalMesh);

        // The instrument tuner's dial writes mesh.currentMix and calls
        // applyMix(); that fires this callback so the bottom bar re-skins
        // its emojis and names to match the new mix.
        musicalMesh.onMixChange = () => instrumentSelector.refreshLabels();

        // Two bars: audio controls hug the left edge, visual controls
        // hug the right edge. They share the same tuners dict so closing
        // a panel on one side propagates to the other.
        const leftBar  = new ControlBar({ mesh: musicalMesh, tuners, side: "left" });
        const rightBar = new ControlBar({ mesh: musicalMesh, tuners, side: "right" });

        // Keep the 🌱 slot lit while the sequencer is running so the user
        // can find the stop control after closing the panel.
        seedSequencer.onPlayingChange = () => ControlBar.refreshAll();

        const layout = new Layout();
        const animation = new Animation(layout);

        // The page loads muted. Audio turns on only when the user clicks
        // the breathing sound toggle in the left control bar (controls.js).
        // A plain click just resumes an already-enabled context — e.g. one
        // the browser auto-suspended while the tab was backgrounded — it
        // never unmutes on its own.
        document.addEventListener("click", (e) => {
          if (musicalMesh.enabled) musicalMesh.start();
          // Project-button clicks should navigate, not retune the mesh.
          if (e.target.closest(".button")) return;
          // Instrument-slot clicks change the timbre, not the key.
          if (e.target.closest(".instrument-slot")) return;
          // Control-bar clicks (mute, tuner toggles) shouldn't retune either.
          if (e.target.closest(".control-slot")) return;
          // Tuner panel interactions (sliders, buttons) shouldn't retune.
          if (e.target.closest(".tuner-panel")) return;
          // Grid click → set new key/octave and play a chord at that location.
          // When tonal panel's "Click locks key" is on, skip the retune so
          // the picked scale/key/octave stays put (wave still fires).
          const w = window.innerWidth;
          const h = window.innerHeight;
          if (!musicalMesh.keyLocked) {
            musicalMesh.setAnchor(e.clientX, e.clientY, w, h);
          }
          background.flashAt(e.clientX, e.clientY);
          background.setKeyColor(musicalMesh.keyOffset, musicalMesh.octaveOffset, e.clientX, e.clientY);
          musicalMesh.waveTriggerAt(background.cyanDots, e.clientX, e.clientY, w, h, background.waveSpeed);
        });
      });
    </script>
  </body>
</html>
